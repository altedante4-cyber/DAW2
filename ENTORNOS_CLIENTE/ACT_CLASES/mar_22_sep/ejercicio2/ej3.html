<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número</title>
</head>
<body>
    <script>
        let numero = parseInt(Math.random() * 101);
        let numero_usuario = 0;
        console.log(numero);

        while (numero !== numero_usuario) {
            numero_usuario = parseInt(prompt("Introduce un número:"));

            if(isNaN(numero_usuario)){
                alert("Introduciste un valor invalido perdiste la partida");
                break;
            }

        }

        if (numero === numero_usuario) {
            alert("Ganaste la partida");
        }
    </script>
</body>
</html>
